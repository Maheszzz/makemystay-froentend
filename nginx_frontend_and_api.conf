# Public site (makemystay.ai) — static Vite build + API proxy.
# After edits: sudo nginx -t && sudo systemctl reload nginx
#
# Canonical host: https://makemystay.ai (apex). All www traffic 301s here so the SPA + /api/v1
# stay one origin (no apex vs www CORS or mismatched API hosts).
#
# If nginx terminates TLS, duplicate the first server block for listen 443 ssl with your
# cert paths (e.g. certbot: /etc/letsencrypt/live/makemystay.ai/fullchain.pem).
#
# Deploy checklist:
#   - curl -I http://www.makemystay.ai/  → 301 Location: https://makemystay.ai/
#   - ls /var/www/react-app/assets/
#   - curl -I https://makemystay.ai/assets/<name-from-index>.js  → application/javascript

# --- www → apex (must be a separate server_name from the app block) ---
server {
    listen 80;
    listen [::]:80;
    server_name www.makemystay.ai;

    return 301 https://makemystay.ai$request_uri;
}

# --- Main site (apex only) ---
server {
    listen 80;
    listen [::]:80;
    server_name makemystay.ai;

    root /var/www/react-app;
    index index.html;

    # Hashed JS/CSS — never fall back to index.html (that causes text/html + white screen)
    location /assets/ {
        root /var/www/react-app;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite public/ files at site root (logo.svg, manifest.json, robots.txt) — never SPA-fallback to HTML
    location ~* ^/[^/]+\.(svg|ico|png|jpg|jpeg|gif|webp|json|webmanifest|txt|xml)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA: real files first, then index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
