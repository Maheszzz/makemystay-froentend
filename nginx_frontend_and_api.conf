# Public site (makemystay.ai) — static Vite build + API proxy.
# After edits: sudo nginx -t && sudo systemctl reload nginx
#
# Canonical host: https://makemystay.ai (apex). All www traffic 301s here so the SPA + /api/v1
# stay one origin (no apex vs www CORS or mismatched API hosts).
#
# If nginx terminates TLS, duplicate the first server block for listen 443 ssl with your
# cert paths (e.g. certbot: /etc/letsencrypt/live/makemystay.ai/fullchain.pem).
#
# Deploy checklist:
#   - curl -I http://www.makemystay.ai/  → 301 Location: https://makemystay.ai/
#   - ls /var/www/react-app/assets/
#   - curl -I https://makemystay.ai/assets/<name-from-index>.js  → application/javascript

# --- Bot Prerendering (Prerender.io) ---
map $http_user_agent $prerender_ua {
    default       0;
    "~*googlebot"                               1;
    "~*bingbot"                                 1;
    "~*yandex"                                  1;
    "~*baiduspider"                             1;
    "~*facebookexternalhit"                     1;
    "~*twitterbot"                              1;
    "~*linkedinbot"                             1;
    "~*slackbot"                                1;
    "~*whatsapp"                                1;
    "~*telegrambot"                             1;
}

map $args $prerender_args {
    default $prerender_ua;
    "~(^|&)_escaped_fragment_=" 1;
}

map $http_x_prerender $prerender {
    default $prerender_args;
    "1"     0;
}

# --- www → apex (must be a separate server_name from the app block) ---
server {
    listen 80;
    listen [::]:80;
    server_name www.makemystay.ai;

    return 301 https://makemystay.ai$request_uri;
}

# --- Main site (apex only) ---
server {
    listen 80;
    listen [::]:80;
    server_name makemystay.ai;

    root /var/www/react-app;
    index index.html;

    # Prerender for bots
    location / {
        if ($prerender = 1) {
            rewrite .* /$scheme://$host$request_uri? break;
            proxy_set_header X-Prerender-Token sD2qtrj63FIFPg2bkGRz;
            proxy_pass https://service.prerender.io;
        }

        try_files $uri $uri/ /index.html;
    }

    # Hashed JS/CSS — never fall back to index.html
    location /assets/ {
        root /var/www/react-app;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets — never prerender
    location ~* ^/[^/]+\.(svg|ico|png|jpg|jpeg|gif|webp|json|webmanifest|txt|xml)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Legacy Redirect System ---
    
    # Handle /properties?cat=...
    location = /properties {
        if ($arg_cat = "pg") { return 301 /pg/bangalore; }
        if ($arg_cat = "rent") { return 301 /rent/bangalore; }
        if ($arg_cat = "buy") { return 301 /buy/in/bangalore; }
        if ($arg_cat = "plot") { return 301 /plots/in/bangalore; }
        try_files $uri $uri/ /index.html;
    }

    # Handle /rent-in-{locality}
    location ~* ^/rent-in-(.*)$ {
        set $locality $1;
        if ($locality = "whitefield") { return 301 /rent/whitefield; }
        if ($locality = "marathahalli") { return 301 /rent/marathahalli; }
        if ($locality = "btm-layout") { return 301 /rent/btm; }
        if ($locality = "electronic-city") { return 301 /rent/electronic-city; }
        if ($locality = "indiranagar") { return 301 /rent/indiranagar; }
        if ($locality = "koramangala") { return 301 /rent/koramangala; }
        if ($locality = "hsr-layout") { return 301 /rent/hsr-layout; }
        if ($locality = "bellandur") { return 301 /rent/bellandur; }
        if ($locality = "sarjapur-road") { return 301 /rent/sarjapur-road; }
        if ($locality = "hebbal") { return 301 /rent/hebbal; }
        if ($locality = "jp-nagar") { return 301 /rent/jp-nagar; }
        if ($locality = "bannerghatta-road") { return 301 /rent/bannerghatta-road; }
        return 301 /rent/bangalore;
    }
}
