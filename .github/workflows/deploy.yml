name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/makemystay_key.pem
          chmod 600 ~/.ssh/makemystay_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Generate Environment Variables
        run: |
          # In GitHub Actions, ensure you store production env variables in secrets
          echo "${{ secrets.ENV_PRODUCTION }}" > .env.production

      - name: Run React Deploy Script
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # Inject GitHub Actions secrets into the deploy script
          sed -i 's|^PEM_KEY=.*|PEM_KEY="$HOME/.ssh/makemystay_key.pem"|' deploy.sh
          sed -i 's|^EC2_HOST=.*|EC2_HOST="'"$EC2_HOST"'"|' deploy.sh
          sed -i 's|^EC2_USER=.*|EC2_USER="'"$EC2_USER"'"|' deploy.sh
          
          # Execute the frontend deploy script
          bash deploy.sh
